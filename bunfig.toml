[test]
root = "./src"
# Literal path, not the "@opentui/solid/preload" export: the Stryker bun
# runner's bunfig sanitizer resolves preload entries against the project
# root, so in the sandbox the export becomes a nonexistent
# <root>/@opentui/solid/preload. This is the same file the export's bun
# condition loads; plain `bun test` runs it the same way.
preload = ["./node_modules/@opentui/solid/scripts/preload.js", "./test-isolation.ts"]
