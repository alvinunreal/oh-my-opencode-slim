[test]
root = "./src"
# Literal path, not the "@opentui/solid/preload" export: Stryker copies the
# project into .stryker-tmp/sandbox-* where package subpath resolution fails,
# and bun treats the entry as a sandbox-relative file. Plain `bun test` runs
# this file the same way.
preload = ["./node_modules/@opentui/solid/scripts/preload.js", "./test-isolation.ts"]
