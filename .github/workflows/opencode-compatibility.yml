name: OpenCode Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Verify OpenCode host compatibility
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" @opencode/cli@2.3.0
          V2_LIFECYCLE_HOST="$RUNNER_TEMP/opencode/node_modules/.bin/opencode" bun run verify:host-smoke
