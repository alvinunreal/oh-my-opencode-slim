name: Companion Auto Release

# Native sources may land between npm releases, but npm must never ship an older
# Companion binary than the native sources included in that plugin release.
on:
  push:
    branches: [master]
    paths:
      - 'companion/src/**'
      - 'companion/assets/**'
      - 'companion/animations/**'
      - 'companion/build.rs'
      - 'companion/Cargo.toml'
      - 'companion/Cargo.lock'
      # Bootstrap immediately when this workflow is first merged.
      - '.github/workflows/companion-auto-release.yml'
      - '.github/workflows/companion-release.yml'
      - 'scripts/verify-companion-source.mjs'
      - 'scripts/check-companion-release.mjs'
      - 'scripts/prepare-companion-release.mjs'
  workflow_dispatch:
  # Recover incomplete uploads or pending manifest handoffs without manual polling.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pull-requests: write

# Do not race two releases against the same last published Companion tag.
concurrency:
  group: companion-native-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
      sync_needed: ${{ steps.check.outputs.sync_needed }}
      next_version: ${{ steps.check.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the latest native release and calculate next action
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          tag="$(git tag -l 'companion-v[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "::error::No native Companion release tag found."
            exit 1
          fi
          version="${tag#companion-v}"
          IFS='.' read -r major minor patch <<< "$version"
          if [[ ! "$major" =~ ^[0-9]+$ ||
                ! "$minor" =~ ^[0-9]+$ ||
                ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected Companion tag: $tag"
            exit 1
          fi

          set +e
          node scripts/verify-companion-source.mjs --tag="$tag"
          source_status=$?
          set -e
          if [ "$source_status" -ne 0 ] && [ "$source_status" -ne 2 ]; then
            echo "::error::Companion native source verifier failed unexpectedly."
            exit "$source_status"
          fi

          # Release lookup must fail closed on GitHub API/transport errors.
          # Only an actual missing or incomplete release triggers a new build.
          release_state="$(node scripts/check-companion-release.mjs --tag="$tag")"
          case "$release_state" in
            complete) complete=true ;;
            missing|incomplete) complete=false ;;
            *)
              echo "::error::Unrecognized Companion release state: $release_state"
              exit 1
              ;;
          esac

          manifest_tag="$(node -p "JSON.parse(require('fs').readFileSync('src/companion/companion-manifest.json', 'utf8')).tag")"
          if [ "$source_status" -eq 2 ] || [ "$complete" != true ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "sync_needed=true" >> "$GITHUB_OUTPUT"
            echo "next_version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"
            echo "::notice::Native release required: source drift=$source_status; latest release complete=$complete"
          elif [ "$manifest_tag" != "$tag" ]; then
            # Native binaries published successfully, but the manifest PR
            # previously failed or has not yet been merged: resume this stage.
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "sync_needed=true" >> "$GITHUB_OUTPUT"
            echo "next_version=$version" >> "$GITHUB_OUTPUT"
            echo "::notice::Native release $tag is complete; manifest sync pending."
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            echo "next_version=$version" >> "$GITHUB_OUTPUT"
            echo "Native Companion release and manifest are synchronized at $tag."
          fi

  native_release:
    needs: detect
    if: ${{ needs.detect.outputs.release_needed == 'true' }}
    uses: ./.github/workflows/companion-release.yml
    with:
      version: ${{ needs.detect.outputs.next_version }}
      targets: macos-arm64,macos-x64,linux-x64,linux-arm64,windows-x64
    permissions:
      contents: write

  sync_manifest:
    needs: [detect, native_release]
    if: >-
      always() && !cancelled() && needs.detect.result == 'success' &&
      needs.detect.outputs.sync_needed == 'true' &&
      (needs.native_release.result == 'success' ||
       needs.native_release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download published native release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.next_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "companion-v$VERSION" --dir release-assets

      - name: Generate Cargo version and both manifest copies from published assets
        env:
          VERSION: ${{ needs.detect.outputs.next_version }}
        run: node scripts/prepare-companion-release.mjs --version="$VERSION" --assets-dir=release-assets

      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun ci
      - name: Normalize generated manifest formatting
        run: bunx biome format --write src/companion/updater.ts src/companion/companion-manifest.json
      - name: Verify generated release state
        run: |
          git fetch --tags origin
          bun run verify:companion-manifest
          bun run verify:companion-source
          bun run check:ci
          bun run typecheck
          bun test

      - name: Open or recover release synchronization PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.next_version }}
        run: |
          set -euo pipefail
          branch="chore/companion-v$VERSION-manifest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Existing release sync branch $branch; recovering PR creation."
          else
            git switch -c "$branch"
            git add companion/Cargo.toml companion/Cargo.lock \
              src/companion/companion-manifest.json src/companion/updater.ts
            if git diff --cached --quiet; then
              echo "::notice::Native release metadata is already synchronized on master."
              exit 0
            fi
            git commit -m "chore(companion): sync published native v$VERSION"
            git push origin "$branch"
          fi

          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "Native manifest synchronization PR is already open."
            exit 0
          fi

          body="Generated from the *published* companion-v$VERSION release assets.\n\nNative code provenance is verified against the release tag; SHA-256 hashes were calculated from the uploaded archives.\n\nThe official OMO Slim npm release is blocked until this PR is merged.\n\nRefs #1427."
          if ! gh pr create --base master --head "$branch" \
            --title "chore(companion): sync native v$VERSION release" \
            --body "$(printf '%b' "$body")"; then
            echo "::error::Native assets were published, but the manifest PR could not be opened. Enable Actions-created PRs in Settings; the branch remains available for recovery."
            exit 1
          fi
